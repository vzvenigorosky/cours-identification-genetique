<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices — Identification génétique</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="exercices">

  <main class="wrap">
    <h1 class="page-title" data-fr="Exercices générés" data-en="Generated exercises"></h1>
    <p class="page-intro"
       data-fr="Des cas tirés au hasard à chaque essai. Cliquez sur « Nouveau cas » autant de fois que vous voulez : chaque exercice se corrige tout seul."
       data-en="Randomly drawn cases on every attempt. Click “New case” as often as you like: each exercise corrects itself."></p>

    <div class="grid">
      <a class="card" href="ex_consensus.html">
        <span class="ico">🧬</span>
        <span class="badge badge-1" data-fr="Niveau 1" data-en="Level 1"></span>
        <h3 data-fr="Profil consensus" data-en="Consensus profile"></h3>
        <p data-fr="ADN dégradé (LCN). Lisez plusieurs réplicats avec pertes d'allèles (drop-out) et construisez le profil consensus, puis concluez : correspondance ou exclusion."
           data-en="Degraded DNA (LCN). Read several replicates with allele drop-out and build the consensus profile, then conclude: match or exclusion."></p>
        <span class="go" data-fr="Lancer →" data-en="Start →"></span>
      </a>

      <a class="card" href="ex_rmp.html">
        <span class="ico">📊</span>
        <span class="badge badge-1" data-fr="Niveau 1" data-en="Level 1"></span>
        <h3 data-fr="Correspondance fortuite (RMP)" data-en="Random match (RMP)"></h3>
        <p data-fr="Choisissez la bonne formule (homozygote / hétérozygote) à chaque locus, combinez les fréquences et interprétez le « 1 sur N »."
           data-en="Pick the right formula (homozygous / heterozygous) at each locus, combine the frequencies and interpret the “1 in N”."></p>
        <span class="go" data-fr="Lancer →" data-en="Start →"></span>
      </a>

      <a class="card" href="ex_deconvolution.html">
        <span class="ico">⚗️</span>
        <span class="badge badge-2" data-fr="Niveau 2" data-en="Level 2"></span>
        <h3 data-fr="Déconvolution de mélange" data-en="Mixture deconvolution"></h3>
        <p data-fr="Scénario d'agression : isolez le profil de l'agresseur dans un mélange en soustrayant le profil connu de la victime."
           data-en="Assault scenario: isolate the assailant's profile from a mixture by subtracting the victim's known profile."></p>
        <span class="go" data-fr="Lancer →" data-en="Start →"></span>
      </a>

      <a class="card" href="ex_paternite.html">
        <span class="ico">👪</span>
        <span class="badge badge-2" data-fr="Niveau 2" data-en="Level 2"></span>
        <h3 data-fr="Paternité &amp; parenté" data-en="Paternity &amp; kinship"></h3>
        <p data-fr="Trio ou duo : vérifiez la compatibilité allélique parent/enfant, décidez inclusion ou exclusion et estimez la force de la preuve (LR)."
           data-en="Trio or duo: check parent/child allele compatibility, decide inclusion or exclusion and estimate the strength of the evidence (LR)."></p>
        <span class="go" data-fr="Lancer →" data-en="Start →"></span>
      </a>

      <a class="card" href="ex_dvi.html">
        <span class="ico">🚢</span>
        <span class="badge badge-3" data-fr="Niveau 3" data-en="Level 3"></span>
        <h3 data-fr="Atelier DVI (catastrophe)" data-en="DVI workshop (disaster)"></h3>
        <p data-fr="Identifiez un corps dégradé par comparaison avec des objets personnels de fiabilité variable, en gérant les pertes d'allèles."
           data-en="Identify a degraded body by comparison with personal items of varying reliability, handling allele drop-out."></p>
        <span class="go" data-fr="Lancer →" data-en="Start →"></span>
      </a>
    </div>
  </main>

  <script src="assets/i18n.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
