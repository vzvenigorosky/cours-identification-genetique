<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identification génétique — Portail étudiant</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="home">

  <header class="hero">
    <h1 data-fr="Identification génétique médico-légale"
        data-en="Forensic genetic identification"></h1>
    <p data-fr="Fiches de cours, annales corrigées, exercices générés et QCM d'examen — pour les étudiants du Master."
       data-en="Revision sheets, past exams with corrections, generated exercises and exam-style quizzes — for Master's students."></p>
  </header>

  <main class="wrap">

    <div class="grid">
      <a class="card" href="fiches.html">
        <span class="ico">📄</span>
        <h3 data-fr="Fiches récapitulatives" data-en="Revision sheets"></h3>
        <p data-fr="Les fiches PDF de chaque chapitre, accompagnées des explications audio."
           data-en="The PDF summary sheet for each chapter, with audio explanations."></p>
        <span class="go" data-fr="Ouvrir →" data-en="Open →"></span>
      </a>

      <a class="card" href="questions.html">
        <span class="ico">💬</span>
        <h3 data-fr="Questions de cours" data-en="Course questions"></h3>
        <p data-fr="Des cartes question/réponse par chapitre pour réviser l'essentiel."
           data-en="Flashcard-style question/answer cards by chapter to revise the essentials."></p>
        <span class="go" data-fr="Réviser →" data-en="Revise →"></span>
      </a>

      <a class="card" href="exercices.html">
        <span class="ico">🧪</span>
        <h3 data-fr="Exercices" data-en="Exercises"></h3>
        <p data-fr="Des cas générés aléatoirement : consensus, RMP, mélanges, parenté, DVI."
           data-en="Randomly generated cases: consensus, RMP, mixtures, kinship, DVI."></p>
        <span class="go" data-fr="S'entraîner →" data-en="Practise →"></span>
      </a>

      <a class="card" href="qcm.html">
        <span class="ico">📝</span>
        <h3 data-fr="QCM d'examen" data-en="Exam quiz"></h3>
        <p data-fr="Un questionnaire à choix multiples type examen : on répond à tout, puis on corrige."
           data-en="An exam-style multiple-choice quiz: answer everything, then get the correction."></p>
        <span class="go" data-fr="Composer →" data-en="Take it →"></span>
      </a>

      <a class="card" href="annales.html">
        <span class="ico">🗂️</span>
        <h3 data-fr="Annales corrigées" data-en="Past exams"></h3>
        <p data-fr="Les sujets d'examens des années précédentes, avec corrections audio."
           data-en="Exam papers from previous years, with audio corrections."></p>
        <span class="go" data-fr="Consulter →" data-en="Browse →"></span>
      </a>
    </div>

    <h2 class="section" data-fr="Foire aux questions" data-en="Frequently asked questions"></h2>

    <details class="collapse">
      <summary data-fr="Faudra-t-il calculer des fréquences à l'examen ?"
               data-en="Will I need to compute frequencies in the exam?"></summary>
      <div class="body">
        <p data-fr="Non, les calculs seraient trop longs. Je peux en revanche vous demander de retrouver des fréquences dans un tableau ou sur un graphique."
           data-en="No, the calculations would be too long. However, I may ask you to read frequencies from a table or a graph."></p>
      </div>
    </details>

    <details class="collapse">
      <summary data-fr="Faudra-t-il calculer des LR à l'examen ?"
               data-en="Will I need to compute LRs in the exam?"></summary>
      <div class="body">
        <p data-fr="Non, les calculs seraient trop longs. Je vous demanderai plutôt de comparer des LR entre eux."
           data-en="No, the calculations would be too long. I will rather ask you to compare LRs with one another."></p>
      </div>
    </details>

    <div class="panel mt">
      <h2 data-fr="Une erreur ? Une question ?" data-en="Found a mistake? A question?"></h2>
      <p data-fr-html="N'hésitez pas à me contacter à <strong>zvenigorosky@unistra.fr</strong> si vous avez des questions ou si vous remarquez une erreur — et n'hésitez pas non plus à me dire que tout marche bien !"
         data-en-html="Feel free to contact me at <strong>zvenigorosky@unistra.fr</strong> with any question or if you spot a mistake — and do tell me when everything works well, too!"></p>
    </div>

  </main>

  <script src="assets/i18n.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
