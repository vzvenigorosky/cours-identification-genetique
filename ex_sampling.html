<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Échantillonnage de scellés — Exercice</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .scelle { display:flex; gap:14px; align-items:flex-start; }
    .scelle h2 { margin:0 0 3px; color:var(--ink); font-size:1.15rem; }
    .scelle p  { margin:0; color:var(--muted); font-size:.92rem; }
    #scene { width:100%; max-width:560px; height:auto; border:1px solid var(--border); border-radius:10px;
             background:#f6f8fa; display:block; touch-action:none; }
    #scene.armed { cursor:crosshair; }
    .pal-label { font-weight:700; font-size:.82rem; color:var(--ink); margin:14px 0 6px; }
    .palette { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:999px;
            padding:6px 13px; font-size:.88rem; font-weight:600; cursor:pointer; transition:all .12s; }
    .chip:hover { background:var(--stripe); border-color:var(--accent); }
    .chip.sel { background:linear-gradient(180deg,var(--green),var(--blue)); color:#fff; border-color:var(--blue); }
    .chip.light.sel { background:#111827; border-color:#111827; }
    .hint { font-size:.9rem; color:var(--muted); min-height:1.2em; margin:10px 0 0; }
    .hint strong { color:var(--ink); }
    .result-grid { display:flex; flex-wrap:wrap; gap:18px; margin:6px 0 10px; }
    .stat { background:var(--stripe); border:1px solid var(--border); border-radius:8px; padding:8px 14px; }
    .stat .v { font-size:1.2rem; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
    .stat .k { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
    .legend { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0 0; font-size:.78rem; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  </style>
</head>
<body data-page="exercices">

  <main class="wrap narrow">
    <a class="btn btn-ghost" href="exercices.html" data-fr="← Retour aux exercices" data-en="← Back to exercises"></a>
    <h1 class="page-title mt" data-fr="Échantillonnage de scellés" data-en="Sampling sealed evidence"></h1>
    <p class="page-intro"
       data-fr="Un objet réel vous est présenté. Éclairez-le si besoin, choisissez un test puis cliquez un point pour l'appliquer, enfin choisissez un instrument et cliquez où prélever. Objectif : récupérer de l'ADN exploitable."
       data-en="A real object is shown. Light it if needed, pick a test then click a point to apply it, finally pick an instrument and click where to sample. Goal: recover usable DNA."></p>

    <div class="panel">
      <div class="controls" style="justify-content:space-between; align-items:flex-start">
        <div class="scelle" id="scelle"></div>
        <button class="btn btn-ghost" id="newCase" data-i18n="common.newcase"></button>
      </div>
      <div style="text-align:center; margin-top:12px">
        <svg id="scene" viewBox="0 0 400 260" role="img" aria-label="evidence"></svg>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:#d64545"></i><span data-fr="Sang" data-en="Blood"></span></span>
        <span><i class="dot" style="background:#2f6fb0"></i><span data-fr="Sperme" data-en="Semen"></span></span>
        <span><i class="dot" style="background:#d6a516"></i><span data-fr="Salive" data-en="Saliva"></span></span>
        <span><i class="dot" style="background:#59d99a"></i><span data-fr="Révélé par la lumière" data-en="Revealed by light"></span></span>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="panel">
      <div class="pal-label" data-fr="1. Lumière (révèle les fluides fluorescents)" data-en="1. Light (reveals fluorescent fluids)"></div>
      <div class="palette" id="lights"></div>

      <div class="pal-label" data-fr="2. Test d'orientation — puis cliquez un point" data-en="2. Orientation test — then click a point"></div>
      <div class="palette" id="tests"></div>

      <div class="pal-label" data-fr="3. Instrument de prélèvement — puis cliquez où prélever" data-en="3. Sampling instrument — then click where to sample"></div>
      <div class="palette" id="instruments"></div>

      <div class="feedback" id="fb"></div>
    </div>
  </main>

  <script src="assets/i18n.js"></script>
  <script src="assets/data/sampling.js"></script>
  <script src="assets/layout.js"></script>
  <script>
  (function () {
    var S = window.SAMPLING;
    var fb = document.getElementById("fb");
    var scene = document.getElementById("scene");
    var state = {};
    function L(fr, en) { return I18N.getLang() === "en" ? en : fr; }
    function pick(o) { return I18N.pick(o); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function fnum(n) { return (Math.round(n * 1000) / 1000).toFixed(3); }
    function clamp01(n) { return Math.max(0, Math.min(1, n)); }

    /* ---- SVG draw routines for each modelled object (400×260 canvas) ---- */
    var DRAW = {
      fta: function () {
        return '<rect x="50" y="45" width="300" height="170" rx="12" fill="#fdfdfb" stroke="#c7ccd1" stroke-width="2"/>' +
               '<circle cx="200" cy="132" r="52" fill="none" stroke="#c7ccd1" stroke-width="1.5" stroke-dasharray="4 4"/>' +
               '<text x="66" y="68" font-size="12" font-weight="700" fill="#9aa4ad">FTA</text>';
      },
      shirt: function () {
        return '<path d="M150 66 C165 82 185 86 200 86 C215 86 235 82 250 66 L288 86 L312 128 L286 150 L258 134 L258 228 L142 228 L142 134 L114 150 L88 128 L112 86 Z" ' +
               'fill="#eef3f7" stroke="#b9c2cb" stroke-width="2" stroke-linejoin="round"/>' +
               '<path d="M150 66 C168 92 232 92 250 66" fill="none" stroke="#b9c2cb" stroke-width="1.5"/>';
      },
      sheet: function () {
        var s = '<rect x="48" y="52" width="304" height="156" rx="8" fill="#f3f6f9" stroke="#b9c2cb" stroke-width="2"/>';
        for (var i = 0; i < 4; i++) {
          var x = 78 + i * 72;
          s += '<path d="M' + x + ' 58 q 10 50 0 100 q -10 50 0 100" fill="none" stroke="#dde3e9" stroke-width="2" transform="translate(0,-6)"/>';
        }
        return s;
      },
      underwear: function () {
        return '<path d="M118 84 L282 84 L272 150 C258 196 214 196 200 160 C186 196 142 196 128 150 Z" ' +
               'fill="#eef3f7" stroke="#b9c2cb" stroke-width="2" stroke-linejoin="round"/>' +
               '<path d="M118 92 L282 92" fill="none" stroke="#cfd8e0" stroke-width="3"/>';
      },
      swab: function () {
        return '<rect x="118" y="125" width="214" height="9" rx="4.5" fill="#d8b98a" stroke="#c6a876"/>' +
               '<ellipse cx="95" cy="130" rx="31" ry="21" fill="#fbfbf7" stroke="#cfd4d8" stroke-width="1.5"/>' +
               '<ellipse cx="332" cy="130" rx="7" ry="9" fill="#e7e2d6" stroke="#cfd4d8"/>';
      },
      cig: function () {
        var s = '<rect x="168" y="112" width="164" height="36" rx="5" fill="#fbfbf7" stroke="#e0dcd2" stroke-width="1.5"/>' +
                '<rect x="70" y="112" width="100" height="36" rx="7" fill="#d8a85f" stroke="#c6974d" stroke-width="1.5"/>';
        for (var i = 0; i < 5; i++) s += '<circle cx="' + (84 + i * 18) + '" cy="130" r="1.6" fill="#b9823d"/>';
        s += '<path d="M326 112 q10 18 0 36" fill="#6b6b6b" opacity="0.5"/>';
        return s;
      },
      knife: function () {
        return '<rect x="58" y="110" width="124" height="42" rx="11" fill="#4b3a2f" stroke="#372a21"/>' +
               '<circle cx="78" cy="131" r="4" fill="#2c2119"/><circle cx="150" cy="131" r="4" fill="#2c2119"/>' +
               '<path d="M182 113 L346 131 L182 149 Z" fill="#cdd2d7" stroke="#aab1b8" stroke-width="1.5" stroke-linejoin="round"/>' +
               '<path d="M182 131 L346 131" stroke="#b4bbc2" stroke-width="1"/>';
      },
      redstain: function () {
        return '<rect x="40" y="40" width="320" height="180" rx="6" fill="#eceff1" stroke="#cfd4d8" stroke-width="1.5"/>' +
               '<line x1="40" y1="100" x2="360" y2="100" stroke="#e1e5e8"/><line x1="40" y1="160" x2="360" y2="160" stroke="#e1e5e8"/>';
      }
    };

    function stainSVG(cx, cy, r, color, op) {
      op = op == null ? 0.8 : op;
      return '<g opacity="' + op + '">' +
        '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + r + '" ry="' + (r * 0.82).toFixed(1) + '" fill="' + color + '"/>' +
        '<ellipse cx="' + (cx - r * 0.5).toFixed(1) + '" cy="' + (cy + r * 0.34).toFixed(1) + '" rx="' + (r * 0.46).toFixed(1) + '" ry="' + (r * 0.4).toFixed(1) + '" fill="' + color + '"/>' +
        '<ellipse cx="' + (cx + r * 0.55).toFixed(1) + '" cy="' + (cy - r * 0.24).toFixed(1) + '" rx="' + (r * 0.4).toFixed(1) + '" ry="' + (r * 0.42).toFixed(1) + '" fill="' + color + '"/>' +
        '</g>';
    }
    function glowSVG(cx, cy, r) {
      return '<g>' +
        '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (r * 1.18).toFixed(1) + '" ry="' + (r * 1.0).toFixed(1) + '" fill="#bdf5d6" opacity="0.45"/>' +
        '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + r + '" ry="' + (r * 0.82).toFixed(1) + '" fill="#e9fff2" opacity="0.55" stroke="#59d99a" stroke-width="1.5" stroke-dasharray="3 3"/>' +
        '</g>';
    }
    function markerSVG(m) {
      var c = m.positive ? (S.colors[m.fluid] || "#12703f") : "#9aa4ad";
      var sym = m.positive ? "＋" : "－";
      return '<circle cx="' + m.x.toFixed(1) + '" cy="' + m.y.toFixed(1) + '" r="10" fill="#ffffff" opacity="0.92" stroke="' + c + '" stroke-width="1.5"/>' +
        '<text x="' + m.x.toFixed(1) + '" y="' + (m.y + 4).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="800" fill="' + c + '">' + sym + '</text>';
    }
    function footprintSVG(fp, x, y) {
      x = x.toFixed(1); y = y.toFixed(1);
      switch (fp) {
        case "swab": return '<circle cx="' + x + '" cy="' + y + '" r="22" fill="none" stroke="#1e6bb8" stroke-width="2" stroke-dasharray="5 4"/>';
        case "disc": return '<circle cx="' + x + '" cy="' + y + '" r="13" fill="#1e6bb8" fill-opacity="0.22" stroke="#1e6bb8" stroke-width="2"/>';
        case "scalpel": return '<path d="M' + (x - 13) + ' ' + (y - 13) + ' L' + (+x + 13) + ' ' + (+y + 13) + '" stroke="#1e6bb8" stroke-width="2.5" stroke-linecap="round"/>' +
                               '<path d="M' + (+x + 10) + ' ' + (y - 14) + ' l5 -2 -2 5" fill="none" stroke="#1e6bb8" stroke-width="2"/>';
        case "cut": return '<rect x="' + (x - 24) + '" y="' + (y - 18) + '" width="48" height="36" rx="4" fill="#1e6bb8" fill-opacity="0.1" stroke="#1e6bb8" stroke-width="2" stroke-dasharray="6 4"/>';
        case "tape": return '<rect x="' + (x - 21) + '" y="' + (y - 14) + '" width="42" height="28" fill="#1e6bb8" fill-opacity="0.12" stroke="#1e6bb8" stroke-width="2" stroke-dasharray="4 3"/>';
        default: return "";
      }
    }

    /* ---- case generation: resolve male fraction & uncertain identities ---- */
    function resolveMale(sp) {
      switch (sp.maleMode) {
        case "always": return sp.auto * (0.85 + Math.random() * 0.1);
        case "mix":    return sp.auto * (0.4 + Math.random() * 0.2);
        case "random": return Math.random() < 0.5 ? 0 : sp.auto * (0.8 + Math.random() * 0.15);
        default:       return 0; // "none"
      }
    }
    function newCase() {
      var item = S.items[Math.floor(Math.random() * S.items.length)];
      var spots = item.spots.map(function (sp) {
        var s = Object.assign({}, sp);
        // red stain: one case in two is NOT blood (paint/rust) → no DNA
        if (s.uncertain && Math.random() < 0.5) { s.fluid = "paint"; s.auto = 0; s.male = 0; s.degrad = 0; s.isBlood = false; }
        else { s.isBlood = (s.fluid === "blood"); s.male = resolveMale(s); }
        return s;
      });
      state = { item: item, spots: spots, lit: false, revealed: {}, armed: null,
                markers: [], footprint: null, testedSemen: false, testedBlood: false };
      fb.className = "feedback";
      renderHeader(); renderScene(); renderPalettes(); setHint();
    }

    function renderHeader() {
      var it = state.item;
      document.getElementById("scelle").innerHTML =
        "<div><h2>" + esc(pick(it.title)) + "</h2><p>" + esc(pick(it.context)) + "</p></div>";
    }

    function renderScene() {
      var svg = DRAW[state.item.draw] ? DRAW[state.item.draw]() : "";
      // biological spots
      state.spots.forEach(function (s, i) {
        if (s.fluid === "touch" || s.fluid === "none") return;      // invisible, never drawn
        if (s.visible) svg += stainSVG(s.cx, s.cy, s.r, S.colors[s.fluid] || "#d64545");
        else if (s.fluorescent && state.revealed[i]) svg += glowSVG(s.cx, s.cy, s.r);
      });
      state.markers.forEach(function (m) { svg += markerSVG(m); });
      if (state.footprint) svg += footprintSVG(state.footprint.fp, state.footprint.x, state.footprint.y);
      scene.innerHTML = svg;
      scene.classList.toggle("armed", !!state.armed);
    }

    function renderPalettes() {
      chips("lights", S.lights, "light");
      chips("tests", S.tests, "test");
      chips("instruments", S.instruments, "instr");
    }
    function chips(boxId, list, kind) {
      var box = document.getElementById(boxId);
      box.innerHTML = "";
      list.forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button";
        var armed = state.armed && state.armed.kind === kind && state.armed.tool.id === t.id;
        b.className = "chip " + (kind === "light" ? "light " : "") + (armed || (kind === "light" && state.lit && t._on) ? "sel" : "");
        b.textContent = pick(t.label);
        b.addEventListener("click", function () { onChip(kind, t); });
        box.appendChild(b);
      });
    }

    function onChip(kind, tool) {
      if (kind === "light") {
        state.lit = true;
        var found = [];
        state.spots.forEach(function (s, i) {
          if (!s.visible && s.fluorescent && S.fluorescent[s.fluid]) { state.revealed[i] = true; found.push(S.colors[s.fluid]); }
        });
        renderScene();
        setHint(found.length
          ? L("Lumière : fluorescence détectée — une ou plusieurs traces latentes apparaissent.",
              "Light: fluorescence detected — one or more latent traces appear.")
          : L("Lumière : aucune trace fluorescente (le sang et l'ADN de contact ne fluorescent pas).",
              "Light: no fluorescent trace (blood and touch DNA do not fluoresce)."));
        return;
      }
      // toggle-arm a test or an instrument (single armed tool)
      if (state.armed && state.armed.kind === kind && state.armed.tool.id === tool.id) state.armed = null;
      else state.armed = { kind: kind, tool: tool };
      renderPalettes(); renderScene(); setHint();
    }

    function setHint(msg) {
      var el = document.getElementById("hint");
      if (msg) { el.innerHTML = msg; return; }
      if (!state.armed) { el.innerHTML = L("Armez un test ou un instrument, puis cliquez sur l'objet.",
                                           "Arm a test or an instrument, then click the object."); return; }
      var name = esc(pick(state.armed.tool.label));
      el.innerHTML = state.armed.kind === "test"
        ? L("<strong>" + name + "</strong> armé — cliquez un point à tester.", "<strong>" + name + "</strong> armed — click a point to test.")
        : L("<strong>" + name + "</strong> armé — cliquez où prélever.", "<strong>" + name + "</strong> armed — click where to sample.");
    }

    function objCoords(evt) {
      var r = scene.getBoundingClientRect();
      var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
      var cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
      return { x: (cx - r.left) / r.width * 400, y: (cy - r.top) / r.height * 260 };
    }
    function findSpot(x, y, tol) {
      var best = null, bd = 1e9;
      state.spots.forEach(function (s) {
        var d = Math.hypot(x - s.cx, y - s.cy);
        if (d <= s.r + tol && d < bd) { bd = d; best = s; }
      });
      return best;
    }

    function onScene(evt) {
      if (!state.armed) return;
      evt.preventDefault();
      var p = objCoords(evt);
      if (state.armed.kind === "test") applyTest(p);
      else sampleAt(p);
    }

    function applyTest(p) {
      var tool = state.armed.tool;
      if (tool.fluid === "semen") state.testedSemen = true;
      if (tool.fluid === "blood") state.testedBlood = true;
      var sp = findSpot(p.x, p.y, 4);
      var positive = !!(sp && sp.fluid === tool.fluid && sp.auto > 0);
      state.markers.push({ x: p.x, y: p.y, fluid: tool.fluid, positive: positive });
      renderScene();
      setHint(esc(pick(tool.label)) + " : " +
        (positive ? "<strong style='color:" + (S.colors[tool.fluid]) + "'>" + L("POSITIF ＋", "POSITIVE ＋") + "</strong>"
                  : L("négatif －", "negative －")));
    }

    function sampleAt(p) {
      var it = state.item, tool = state.armed.tool;
      state.footprint = { fp: tool.footprint, x: p.x, y: p.y };
      var sp = findSpot(p.x, p.y, 12);
      var tf = (S.substrateTools[it.substrate] || {})[tool.id];
      if (tf == null) tf = 0;
      var rand = 0.8 + Math.random() * 0.4;
      var hasDNA = sp && sp.auto > 0;
      var auto = (hasDNA && tf > 0) ? sp.auto * tf * rand : 0;
      var male = (hasDNA && tf > 0) ? sp.male * tf * rand : 0;
      var degrad = hasDNA ? clamp01(sp.degrad + (Math.random() - 0.5) * 0.08) : 0;
      var ok = auto >= S.threshold;

      var why = [];
      // instrument fit
      if (tf === 0) why.push(L("Cet instrument ne convient pas à ce support (p. ex. on ne découpe pas une lame métallique) → aucun prélèvement exploitable.",
                               "This instrument does not suit this substrate (e.g. you don't cut a metal blade) → no usable sampling."));
      else if (tf >= 0.8) why.push(L("Bon instrument pour ce support.", "Good instrument for this substrate."));
      else if (tf >= 0.4) why.push(L("Instrument acceptable mais pas optimal (rendement réduit).", "Acceptable but sub-optimal instrument (reduced yield)."));
      else why.push(L("Instrument peu adapté à ce support → rendement très faible.", "Instrument poorly suited to this substrate → very low yield."));

      // what was under the footprint
      if (!sp) why.push(L("Le prélèvement est tombé sur une zone propre : aucun matériel biologique.", "The footprint landed on a clean area: no biological material."));
      else if (sp.fluid === "paint") why.push(L("La tache rouge n'était pas du sang (support non biologique) : rien à extraire. Un test d'orientation l'aurait montré.",
                                                "The red stain was not blood (non-biological material): nothing to extract. An orientation test would have shown this."));
      else if (sp.fluid === "touch") why.push(L("ADN de contact : invisible, non révélé par la lumière ni par un test présomptif — faible quantité, à raisonner par le contexte.",
                                                "Touch DNA: invisible, revealed by neither light nor a presumptive test — low amount, reasoned from context."));

      // fraction / differential interpretation
      if (ok) {
        if (male >= S.threshold) why.push(L("Fraction masculine nette → une extraction différentielle est recommandée pour séparer les contributeurs.",
                                            "Clear male fraction → a differential extraction is recommended to separate the contributors."));
        else why.push(L("Pas de fraction masculine : source unique de type féminin → extraction différentielle inutile.",
                        "No male fraction: single feminine-type source → differential extraction unnecessary."));
      }

      // reminders / context
      if (it.refSample) why.push(L("Échantillon de référence : aucun test d'orientation n'était nécessaire.", "Reference sample: no orientation test was necessary."));
      if (it.sa && !state.testedSemen) why.push(L("⚠ Contexte d'agression sexuelle : vous n'avez PAS recherché les spermatozoïdes (Phosphatesmo / microscopie). Il faut le faire avant l'extraction pour ne pas manquer la fraction masculine.",
                                                  "⚠ Sexual-assault context: you did NOT test for spermatozoa (Phosphatesmo / microscopy). This must be done before extraction so the male fraction isn't missed."));
      if (it.spots.some(function (s) { return s.uncertain; }) && !state.testedBlood) why.push(L("Vous avez conclu sans confirmer la nature de la tache : sur une tache rouge, confirmez toujours par un test (Peroxtesmo).",
                                                  "You concluded without confirming the stain's nature: on a red stain, always confirm with a test (Peroxtesmo)."));

      fb.className = "feedback show " + (ok ? "success" : "fail");
      fb.innerHTML =
        "<p><strong>" + (ok ? L("ADN récupéré ✔", "DNA recovered ✔") : L("Échec — pas d'ADN exploitable ✘", "Failure — no usable DNA ✘")) + "</strong></p>" +
        '<div class="result-grid">' +
          '<div class="stat"><div class="v">' + fnum(auto) + '</div><div class="k">' + L("ADN auto. ng/µL", "Auto. DNA ng/µL") + "</div></div>" +
          '<div class="stat"><div class="v">' + fnum(male) + '</div><div class="k">' + L("ADN masculin ng/µL", "Male DNA ng/µL") + "</div></div>" +
          '<div class="stat"><div class="v">' + (auto > 0.001 ? degrad.toFixed(2) : "—") + '</div><div class="k">' + L("Index dégradation", "Degradation index") + "</div></div>" +
        "</div>" +
        "<p>" + why.join(" ") + "</p>" +
        '<p class="muted-note" style="border-top:1px solid var(--border);padding-top:8px"><em>' + esc(pick(state.item.teach)) + "</em></p>";
      renderScene();
    }

    scene.addEventListener("click", onScene);
    document.getElementById("newCase").addEventListener("click", newCase);
    document.addEventListener("langchange", function () {
      renderHeader(); renderScene(); renderPalettes(); setHint();
      if (fb.classList.contains("show")) fb.className = "feedback"; // avoid stale mixed-language result
    });

    newCase();
  })();
  </script>
</body>
</html>
