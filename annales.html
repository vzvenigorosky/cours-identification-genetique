<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annales corrigées — Identification génétique</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="annales">

  <main class="wrap narrow">
    <h1 class="page-title" data-fr="Annales corrigées" data-en="Past exams with corrections"></h1>
    <p class="page-intro"
       data-fr="Les sujets d'examens des années précédentes. Certaines questions sont accompagnées d'une explication audio."
       data-en="Exam papers from previous years. Some questions come with an audio explanation."></p>

    <div id="list"></div>
  </main>

  <script src="assets/i18n.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/analytics.js"></script>
  <script>
  (function () {
    // Only audio files that actually exist in the repo are listed.
    var EXAMS = [
      { fr:"2025 — UE2 — 30 min", en:"2025 — UE2 — 30 min", pdf:"Annale_M2_2025.pdf", audios:[] },
      { fr:"2025 — UE7 — sujet étendu — 30 min", en:"2025 — UE7 — extended paper — 30 min", pdf:"Annale_M1_UE7_2025_etendu.pdf", audios:[] },
      { fr:"2025 — UE8 — sujet étendu — 30 min", en:"2025 — UE8 — extended paper — 30 min", pdf:"Annale_M1_UE8_2025_etendu.pdf", audios:[] },
      { fr:"2024 — UE7 — 15 min", en:"2024 — UE7 — 15 min", pdf:"Annale_M1_UE7_2024.pdf", audios:[] },
      { fr:"2023 — UE8 — 15 min", en:"2023 — UE8 — 15 min", pdf:"Annale_M1_UE8_2023.pdf", audios:[] },
      { fr:"2022 — UE2 — 30 min", en:"2022 — UE2 — 30 min", pdf:"Annale_M2_2022.pdf", audios:[] },
      { fr:"2022 — UE7 — 15 min", en:"2022 — UE7 — 15 min",
        pdf:"Annale_M1_UE7_2022.pdf",
        audios:[ {src:"Annale_M1_UE7_2022.mp3", fr:"Question c. expliquée", en:"Question c explained"} ] },
      { fr:"2022 — UE8 — 15 min", en:"2022 — UE8 — 15 min",
        pdf:"Annale_M1_UE8_2022.pdf",
        audios:[ {src:"Annale_M1_UE8_2022_a.mp3", fr:"Question a. expliquée", en:"Question a explained"},
                 {src:"Annale_M1_UE8_2022_b.mp3", fr:"Question b. expliquée", en:"Question b explained"} ] },
      { fr:"2021 — Identification génétique — 30 min", en:"2021 — Genetic identification — 30 min", pdf:"Annale_M2_2021.pdf", audios:[] },
      { fr:"2021 — UE7 — 15 min", en:"2021 — UE7 — 15 min",
        pdf:"Annale_M1_UE7_2021.pdf",
        audios:[ {src:"Annale_M1_UE7_2021.mp3", fr:"Question d. expliquée", en:"Question d explained"} ] },
      { fr:"2021 — UE8 — 15 min", en:"2021 — UE8 — 15 min",
        pdf:"Annale_M1_UE8_2021.pdf",
        audios:[ {src:"Annale_M1_UE8_2021_a.mp3", fr:"Question a. expliquée", en:"Question a explained"},
                 {src:"Annale_M1_UE8_2021_b.mp3", fr:"Question b. expliquée", en:"Question b explained"} ] }
    ];

    function build(container, items) {
      container.innerHTML = "";
      items.forEach(function (e) {
        var audioHTML = e.audios.map(function (a) {
          return '<p class="audio-label" data-fr="' + a.fr + '" data-en="' + a.en + '"></p>' +
                 '<audio controls preload="none"><source src="' + a.src + '" type="audio/mpeg"></audio>';
        }).join("");
        var d = document.createElement("details");
        d.className = "collapse";
        d.innerHTML =
          '<summary><span data-fr="' + e.fr + '" data-en="' + e.en + '"></span></summary>' +
          '<div class="body">' +
            audioHTML +
            '<p><a class="btn btn-ghost" target="_blank" rel="noopener" href="' + e.pdf + '" ' +
               'data-fr="Ouvrir le sujet (PDF) ↗" data-en="Open the paper (PDF) ↗"></a></p>' +
            '<div class="pdf-slot" data-pdf="' + e.pdf + '"></div>' +
          '</div>';
        d.addEventListener("toggle", function () {
          if (d.open) {
            var slot = d.querySelector(".pdf-slot");
            if (slot && !slot.dataset.loaded) {
              slot.dataset.loaded = "1";
              var emb = document.createElement("embed");
              emb.src = slot.getAttribute("data-pdf");
              emb.type = "application/pdf";
              slot.appendChild(emb);
            }
          }
        });
        container.appendChild(d);
      });
      I18N.apply();
    }

    build(document.getElementById("list"), EXAMS);
  })();
  </script>
</body>
</html>
